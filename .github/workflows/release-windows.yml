name: Release Windows Drafts
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    # Only the canonical tag builds; variant tags retain update compatibility.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate tag, source version and release documentation
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Stable vMAJOR.MINOR.PATCH required' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release source must already be integrated into main' }
          python scripts/ods.py validate-config --config onlytools.config.json
          if ($LASTEXITCODE -ne 0) { throw 'Config validation failed' }
          python scripts/ods.py validate-readme --readme README.md
          if ($LASTEXITCODE -ne 0) { throw 'README validation failed' }
          python scripts/check_product_version.py --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Tag/source version mismatch' }
          python scripts/ods.py validate-changelog --version $version
          if ($LASTEXITCODE -ne 0) { throw 'CHANGELOG validation failed' }
          python scripts/ods.py validate-release --notes "RELEASE-NOTES-v$version.md" --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Release Notes validation failed' }
          python -m unittest discover -s scripts -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Release validation tests failed' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build and run terminal regression tests
        shell: pwsh
        run: |
          dotnet build OnlyShell.sln -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed' }
          dotnet test TerminalPoc/VirtualTerminal-upstream/VirtualTerminal.Tests/VirtualTerminal.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Terminal regression tests failed' }
      - name: Install packaging tools
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Velopack installation failed' }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build both variants and deltas from previous public releases
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-release.ps1 -Version $env:VERSION -PreviousRepository $env:GITHUB_REPOSITORY
      - name: Create draft releases and verify downloaded assets
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          foreach ($variant in @('self-contained', 'framework-dependent')) {
            $tag = "v$env:VERSION-$variant"
            $assets = "artifacts/release/$env:VERSION/assets/$variant"
            $files = @(Get-ChildItem -LiteralPath $assets -File | ForEach-Object { $_.FullName })
            gh release create $tag @files --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title "OnlyShell v$env:VERSION" --notes-file "RELEASE-NOTES-v$env:VERSION.md"
            if ($LASTEXITCODE -ne 0) { throw "Draft creation failed for $tag; existing releases are never overwritten" }
            $download = "artifacts/downloaded/$variant"
            gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $download
            if ($LASTEXITCODE -ne 0) { throw 'Draft asset download failed' }
            python scripts/release_assets.py --directory $download --version $env:VERSION --variant $variant --source-sha $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Downloaded draft verification failed' }
          }
          gh release create "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "OnlyShell v$env:VERSION" --notes-file "RELEASE-NOTES-v$env:VERSION.md"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical version index draft creation failed' }
          'Three drafts remain private: the canonical version index and two update variants. Owner approval and Windows update acceptance are required before publication.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-drafts
          path: artifacts/release/*/assets/
          if-no-files-found: error
